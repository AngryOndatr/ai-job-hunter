name: AI Job Hunter

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-job-hunter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore processed Gmail IDs
        uses: actions/cache/restore@v6
        with:
          path: processed_ids.json
          key: processed-ids-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            processed-ids-${{ github.ref_name }}-

      - name: Write Google OAuth token
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ.get("GOOGLE_TOKEN_JSON", "")
          if not token:
              raise SystemExit("The GOOGLE_TOKEN_JSON repository secret is required.")
          try:
              token_data = json.loads(token)
          except json.JSONDecodeError as exc:
              raise SystemExit("GOOGLE_TOKEN_JSON must contain valid JSON.") from exc
          if not isinstance(token_data, dict):
              raise SystemExit("GOOGLE_TOKEN_JSON must contain a JSON object.")
          scopes = token_data.get("scopes") or []
          if isinstance(scopes, str):
              scopes = scopes.split()
          required_scopes = {
              "https://www.googleapis.com/auth/gmail.readonly",
              "https://www.googleapis.com/auth/gmail.compose",
              "https://www.googleapis.com/auth/drive",
              "https://www.googleapis.com/auth/documents",
          }
          if not isinstance(scopes, list) or not required_scopes.issubset(set(scopes)):
              raise SystemExit("GOOGLE_TOKEN_JSON must be reauthorized with all project Google API scopes.")
          if not token_data.get("refresh_token"):
              raise SystemExit("GOOGLE_TOKEN_JSON must include an OAuth refresh token for scheduled runs.")
          token_path = Path("token.json")
          token_path.write_text(token, encoding="utf-8")
          token_path.chmod(0o600)
          PY

      - name: Record processed-ID state before the run
        id: state-before
        shell: bash
        run: |
          if [[ -f processed_ids.json ]]; then
            checksum="$(sha256sum processed_ids.json | cut -d ' ' -f 1)"
          else
            checksum="missing"
          fi
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Run job application pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u main.py

      - name: Record processed-ID state after the run
        id: state-after
        if: always()
        shell: bash
        run: |
          if [[ -f processed_ids.json ]]; then
            checksum="$(sha256sum processed_ids.json | cut -d ' ' -f 1)"
          else
            checksum="missing"
          fi
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Save processed Gmail IDs
        if: always() && steps.state-after.outputs.checksum != steps.state-before.outputs.checksum
        uses: actions/cache/save@v6
        with:
          path: processed_ids.json
          key: processed-ids-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
