name: AI Job Hunter

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Run a read-only verification or a capped draft-only pilot"
        type: choice
        options:
          - dry-run
          - pilot
          - gemini-check
        default: dry-run
        required: true
      max_jobs:
        description: "Maximum jobs for this manual run (cannot exceed config.yaml limit)"
        type: number
        default: 1
        required: true

permissions:
  contents: read

concurrency:
  group: ai-job-hunter-processing-state
  cancel-in-progress: false

jobs:
  run-pipeline:
    environment: "AI Job Hunter"
    if: github.event_name != 'schedule' || vars.ENABLE_SCHEDULED_RUNS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Gemini API
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'gemini-check'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import yaml
          from google import genai
          from google.genai import errors

          with open("config.yaml", encoding="utf-8") as config_file:
              model = yaml.safe_load(config_file)["ai_policy"]["model"]
          try:
              client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
              client.models.generate_content(model=model, contents="Reply only with OK.")
          except errors.APIError as exc:
              status = f" {exc.status}" if exc.status else ""
              print(f"Gemini check failed: HTTP {exc.code}{status}.")
              raise SystemExit(1) from None
          except Exception as exc:
              print(f"Gemini check failed: {type(exc).__name__}.")
              raise SystemExit(1) from None
          print(f"Gemini check succeeded for model {model}.")
          PY

      - name: Write Google OAuth token
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'gemini-check'
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ.get("GOOGLE_TOKEN_JSON", "")
          if not token:
              raise SystemExit("The GOOGLE_TOKEN_JSON repository secret is required.")
          try:
              token_data = json.loads(token)
          except json.JSONDecodeError as exc:
              raise SystemExit("GOOGLE_TOKEN_JSON must contain valid JSON.") from exc
          if not isinstance(token_data, dict):
              raise SystemExit("GOOGLE_TOKEN_JSON must contain a JSON object.")
          scopes = token_data.get("scopes") or []
          if isinstance(scopes, str):
              scopes = scopes.split()
          required_scopes = {
              "https://www.googleapis.com/auth/gmail.readonly",
              "https://www.googleapis.com/auth/gmail.compose",
              "https://www.googleapis.com/auth/drive",
              "https://www.googleapis.com/auth/documents",
          }
          if not isinstance(scopes, list) or not required_scopes.issubset(set(scopes)):
              raise SystemExit("GOOGLE_TOKEN_JSON must be reauthorized with all project Google API scopes.")
          if not token_data.get("refresh_token"):
              raise SystemExit("GOOGLE_TOKEN_JSON must include an OAuth refresh token for scheduled runs.")
          token_path = Path("token.json")
          token_path.write_text(token, encoding="utf-8")
          token_path.chmod(0o600)
          PY

      - name: Run job application pipeline
        if: github.event_name != 'workflow_dispatch' || inputs.run_mode != 'gemini-check'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: ${{ inputs.run_mode }}
          PILOT_MAX_JOBS: ${{ inputs.max_jobs }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "$RUN_MODE" in
              dry-run) args+=(--dry-run --max-jobs "$PILOT_MAX_JOBS") ;;
              pilot) args+=(--max-jobs "$PILOT_MAX_JOBS") ;;
              *) echo "Unsupported manual run mode." >&2; exit 2 ;;
            esac
          fi
          python -u main.py "${args[@]}"
