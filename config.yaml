# ⚙️ AI Job Hunter Configuration

gmail:
  target_labels:
    - "Glassdoor"
    - "LinkedIn"
    - "Michael Page"
    - "Stepstone.de"
  max_email_age_days: 2
  processed_ids_file: "processed_ids.json"

filters:
  keywords:
    - "Java"
    - "Spring Boot"
    - "Full-Stack"
    - "Microservices"
    - "Angular"
    - "TypeScript"
    - "Software Developer"
    - "Software Engineer"
    - "Senior Software Developer"
    - "Senior Software Engineer"
  blacklisted_keywords:
    - "PHP"
    - "Ruby"
    - "Python Developer"
    - "Senior Manager"
    - "Lead Architect"
    - "Intern"

ai_policy:
  language: "en"
  provider: "google"  # Переключено на Google Gemini
  model: "gemini-1.5-flash"
  min_match_score_to_draft: 75  # Минимальный балл совпадения для создания черновика

# Google Drive / Docs интеграция
google_docs:
  master_resume_doc_id: "your_google_doc_id_here"
  output_folder_id: "your_google_drive_folder_id_here"

paths:
  credentials_file: "credentials.json"
  token_file: "token.json"

# Лимиты обработки за один запуск
limits:
  max_jobs_per_run: 5