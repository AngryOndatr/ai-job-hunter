# ⚙️ AI Job Hunter Configuration

gmail:
  target_labels:
    - "Glassdoor"
    - "LinkedIn"
    - "Michael Page"
    - "Stepstone.de"
  max_email_age_days: 2
  processed_ids_file: "processed_ids.json"

filters:
  keywords:
    - "Java"
    - "Spring Boot"
    - "Full-Stack"
    - "Microservices"
    - "Angular"
    - "TypeScript"
    - "Software Developer"
    - "Software Engineer"
    - "Senior Software Developer"
    - "Senior Software Engineer"
  blacklisted_keywords:
    - "PHP"
    - "Ruby"
    - "Python Developer"
    - "Senior Manager"
    - "Lead Architect"
    - "Intern"

ai_policy:
  language: "en"
  provider: "google"
  model: "gemini-3.8-flash"
  min_match_score_to_draft: 75  # Минимальный балл совпадения для создания черновика

# Google Drive / Docs интеграция
google_docs:
  master_profile_doc_id: "10rKOZ_tiB6epvcyqwYiaQZkQSMVltuhP"
  resume_template_doc_id: "15Lh3YuQ5TusjuiObpRkKC8Ry-QKDKm0d"
  output_folder_id: "1qN48VoP-Rg1Th0wf-GVMAMIpCZxySwAd"

paths:
  credentials_file: "credentials.json"
  token_file: "token.json"

# Лимиты обработки за один запуск
limits:
  max_jobs_per_run: 5
